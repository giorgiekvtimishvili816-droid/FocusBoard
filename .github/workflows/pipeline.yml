name: FocusBoard CI/CD

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: 1 · Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Create distributable
        run: npm run build
      - name: Save build artifact
        uses: actions/upload-artifact@v4
        with:
          name: focusboard-site
          path: dist/
          if-no-files-found: error

  test:
    name: 2 · Test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Get built files
        uses: actions/download-artifact@v4
        with:
          name: focusboard-site
          path: dist/
      - name: Run unit tests
        run: npm test
      - name: Verify build artifact
        run: node scripts/check-dist.mjs

  deploy:
    name: 3 · Deploy (Blue/Green)
    needs: test
    # By default deployment is exercised on a temporary GitHub runner.
    # Repository variable DEPLOY_RUNNER=self-hosted can target a local machine.
    runs-on: ${{ vars.DEPLOY_RUNNER == 'self-hosted' && 'self-hosted' || 'ubuntu-latest' }}
    env:
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
    steps:
      - name: Checkout deployment scripts
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Get tested build artifact
        uses: actions/download-artifact@v4
        with:
          name: focusboard-site
          path: dist/
      - name: Deploy and automatically verify health
        run: bash scripts/deploy.sh
      - name: Optional Vercel production deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        shell: bash
        run: |
          if [[ -z "$VERCEL_TOKEN" || -z "$VERCEL_ORG_ID" || -z "$VERCEL_PROJECT_ID" ]]; then
            echo 'Vercel not configured; local blue/green deployment is already verified.'
            exit 0
          fi
          npm install --global vercel@latest
          mkdir -p dist/.vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > dist/.vercel/project.json
          VERCEL_URL="$(vercel deploy --cwd dist --prod --yes --token "$VERCEL_TOKEN")"
          echo "Vercel production URL: $VERCEL_URL" | tee .deployment/logs/vercel-url.log
          HEALTH_URL="$VERCEL_URL" HEALTH_LOG=.deployment/logs/vercel-health.log bash scripts/health-check.sh
      - name: Save monitoring and deployment logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-logs
          path: .deployment/logs/
          if-no-files-found: warn
